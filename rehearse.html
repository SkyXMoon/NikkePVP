<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<title>演练 · NIKKE PVP</title>
<meta name="robots" content="noindex" />
<style>
  :root{--panel:rgba(20,21,26,.92);--line:#2c2e36;--ink:#e6e6ea;--muted:#8b93a1;--accent:#9fe8c8;--red:#e05a4d;--blue:#4d8ee0}
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;overflow:hidden;background:#0f1014;color:var(--ink);
    font:13px/1.5 system-ui,-apple-system,"Microsoft YaHei",sans-serif;-webkit-text-size-adjust:100%}
  #app{position:fixed;inset:0}
  #app canvas{display:block}
  .panel{position:fixed;background:var(--panel);border:1px solid var(--line);border-radius:12px;
    backdrop-filter:blur(8px);box-shadow:0 8px 28px rgba(0,0,0,.35)}
  #top{left:10px;right:10px;top:10px;padding:8px 10px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;z-index:5}
  #top b{font-size:13px;color:var(--accent);white-space:nowrap}
  #title{color:var(--muted);font-size:12px;white-space:nowrap;max-width:30vw;overflow:hidden;text-overflow:ellipsis}
  .grp{display:flex;gap:4px;align-items:center}
  button{background:#242832;color:#dfe3ea;border:1px solid #363b47;border-radius:8px;
    padding:6px 11px;font-size:12px;cursor:pointer;line-height:1.2;min-height:32px}
  button:hover{background:#2e3440}
  button:active{transform:translateY(1px)}
  button.on{background:#2a4a3c;border-color:#3d6b55;color:#b7f0d4}
  input[type=range]{flex:1 1 200px;min-width:140px;accent-color:#3f8f6b}
  #fnum{font-variant-numeric:tabular-nums;color:#cfd4dd;min-width:52px;text-align:right}
  #status{color:var(--muted);font-size:11px;flex:1 1 180px;min-width:120px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  #back{color:var(--muted);text-decoration:none;border:1px solid #363b47;border-radius:8px;padding:6px 10px;font-size:12px;white-space:nowrap}
  #back:hover{color:#dfe3ea;background:#242832}
  #right{right:10px;top:var(--top-bottom,64px);width:min(260px,42vw);padding:10px}
  #bottom{left:10px;right:10px;bottom:10px;max-height:16vh;overflow:auto;padding:7px 10px}
  .row{display:flex;justify-content:space-between;gap:8px;padding:2px 4px;border-radius:4px}
  .row .n{color:#cfd4dd}
  .row .c{color:var(--muted);font-size:11px;text-align:right;font-variant-numeric:tabular-nums}
  .bar{height:6px;background:#22252d;border-radius:3px;overflow:hidden;margin-top:3px}
  .bar i{display:block;height:100%;background:linear-gradient(90deg,#3f8f6b,#8ee0b6)}
  .tip{color:#6f7683;font-size:11px;margin-top:4px}
  .ev{display:inline-block;margin:2px 6px 2px 0;padding:1px 6px;border-radius:4px;
    background:#1d2027;border:1px solid #2f333c;font-size:11px;color:#9aa2ae}
  .ev.FIRE{background:#2a1614;border-color:#7a2f27;color:#ff9a8f}
  .ev.RELOAD_START{background:#2a2414;border-color:#7a6a27;color:#ffd88f}
  .ev.AIM_START{background:#14241c;border-color:#275a3f;color:#9fe8c8}
  .ev.BURST_READY{background:#2e2414;border-color:#7a5a27;color:#ffd88f}
  .ev.BURST_START{background:#2a1424;border-color:#7a2750;color:#ff9ae0}
  .ev.BURST_END{background:#1a2029;border-color:#2f3c4c;color:#9fb6d8}
  .ev.BURST_CHARGE{background:#142a29;border-color:#275a58;color:#9fe8e0}
  .k{color:#6f7683}
  /* 加载遮罩：下载模型与场地期间盖住画布，进度来自 stage 的阶段状态 */
  #loading{position:fixed;inset:0;z-index:20;display:grid;place-items:center;background:radial-gradient(circle at 50% 40%,#161922,#0c0d11 70%)}
  #loading.done{opacity:0;pointer-events:none;transition:opacity .45s ease}
  .ld-card{width:min(420px,86vw);padding:22px 20px;border:1px solid var(--line);border-radius:14px;background:rgba(20,21,26,.9);text-align:center}
  .ld-title{font-size:15px;color:var(--accent);margin-bottom:6px}
  .ld-stage{font-size:12px;color:#cfd4dd;min-height:18px}
  .ld-bar{height:5px;background:#22252d;border-radius:3px;overflow:hidden;margin:14px 0 10px}
  .ld-bar i{display:block;height:100%;width:4%;background:linear-gradient(90deg,#3f8f6b,#8ee0b6);transition:width .3s ease}
  .ld-hint{font-size:11px;color:var(--muted);line-height:1.6}
  #ld-retry{margin-top:14px}
  #ld-goto{margin-top:14px;margin-left:8px;display:inline-block;color:#9fe8c8;text-decoration:none;
    border:1px solid #3d6b55;border-radius:8px;padding:6px 11px;font-size:12px;background:#1b2a24}
  #ld-goto:hover{background:#22402f}
  #ld-error{display:none;color:#ff9a8f;font-size:12px;margin-top:10px;word-break:break-all}
  @media (max-width:640px){
    #top{gap:6px;padding:7px 8px}
    #title{max-width:40vw}
    #status{flex-basis:100%;order:9}
    #right{top:auto;bottom:calc(22vh + 18px);width:min(220px,52vw)}
    #bottom{max-height:20vh}
    button{padding:6px 9px}
  }
</style>
</head>
<body>
<div id="app"></div>

<div class="panel" id="top">
  <b>演练</b><span id="title"></span>
  <div class="grp">
    <button id="prev10" title="后退 10 帧">−10</button>
    <button id="prev1" title="后退 1 帧">−1</button>
    <button id="play" title="空格播放/暂停">播放</button>
    <button id="next1" title="前进 1 帧">+1</button>
    <button id="next10" title="前进 10 帧">+10</button>
  </div>
  <input id="frame" type="range" min="0" max="1800" value="0" step="1" aria-label="时间轴" />
  <span id="fnum">F0</span>
  <span id="status">加载中…</span>
  <a id="back" href="/">返回</a>
</div>

<div class="panel" id="right">
  <div id="gauges"></div>
  <div class="tip" id="charge-limit"></div>
</div>

<div class="panel" id="bottom"><div id="events"><span class="k">—</span></div></div>

<!-- stage.js 是调试页与演练页共用的同一份实现：这里补齐它约定的全部控件 id，
     默认隐藏，避免为了「生产页」再复制一份加载/摆姿势逻辑。 -->
<div id="debug-host" hidden>
  <select id="arena">
    <option value="arenanormal">普通</option>
    <option value="arenaspecial">特殊</option>
    <option value="arenachampion">冠军</option>
  </select>
  <select id="fps"><option value="60">60</option><option value="30">30</option></select>
  <select id="speed"><option value="0.25">0.25</option><option value="0.5">0.5</option>
    <option value="1" selected>1</option><option value="2">2</option></select>
  <input id="ground" type="checkbox" />
  <input id="yoff" type="number" value="0" />
  <button id="tofire"></button><button id="tomiss"></button><button id="toburst"></button>
  <div id="left"><div id="lineup"></div><button id="apply-lineup"></button>
    <span id="lineup-error"></span><div id="chars"></div></div>
  <div id="data-limit"></div><div id="gear-info"></div>
</div>

<div id="loading">
  <div class="ld-card">
    <div class="ld-title">正在准备演练</div>
    <div class="ld-stage" id="ld-stage">读取阵容…</div>
    <div class="ld-bar"><i id="ld-bar"></i></div>
    <div class="ld-hint" id="ld-hint">正在下载这场对局需要的 SD 模型与竞技场模型。<br />下载完成后即可逐帧查看每一次开火、换弹与充能。</div>
    <div id="ld-error"></div>
    <button id="ld-retry" hidden>重新加载</button>
    <a id="ld-goto" href="/" hidden>返回主站</a>
  </div>
</div>

<script src="./runtime-config.js"></script>
<script>
  // 演练页从站点自带的资源目录取模型；调试页（simulator/stage.html）仍用本地服务挂载的 /assets。
  window.__SD_ASSET_ROOT__ = '/v2core/assets';
  // 发布产物里 sd_batch 是计算链的壳（网格被裁掉），可渲染的那份在 rehearse 目录；
  // 本地没有该目录时舞台会自动回退到 sd_batch，不影响开发。
  window.__SD_MODEL_SUBDIR__ = 'rehearse';
</script>
<script type="importmap">
{ "imports": { "three": "/v2core/assets/lib/three.module.js", "three/addons/": "/v2core/assets/lib/jsm/" } }
</script>
<script type="module" src="./simulator/src/stage/rehearse-boot.js"></script>
</body>
</html>
